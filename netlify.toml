# ============================================================
# Netlify の設定
#
# このリポジトリは本体を GitHub Pages で公開しているので、
# Netlify には「支払いの確認プログラム」だけを置く。
#
# publish に netlify-public を指定しているのは、
# 診断アプリそのものが Netlify 側にも二重に公開されるのを防ぐため。
# netlify-public の中には案内用のページを1枚だけ置いてある。
# ============================================================
[build]
  publish = "netlify-public"
  functions = "netlify/functions"
  command = ""
