<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資デビュー診断</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23123a5e'/%3E%3Cpath d='M22 68 L42 48 L56 62 L78 34' stroke='%230fa36b' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #eff4f9; color: #0c1c2c;
    font-family: system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans',
      'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', sans-serif;
    line-height: 1.9; text-align: center; padding: 24px;
  }
  .box {
    background: #fff; border: 1px solid rgba(12,28,44,.10); border-radius: 20px;
    padding: 32px 26px; max-width: 460px; box-shadow: 0 2px 10px rgba(12,28,44,.06);
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  p { font-size: 14px; color: #47596b; margin: 0 0 20px; }
  a.btn {
    display: inline-block; background: #0fa36b; color: #fff; text-decoration: none;
    font-weight: 800; font-size: 14px; padding: 13px 26px; border-radius: 12px;
  }
</style>
</head>
<body>
  <!--
    この Netlify サイトは「支払いの確認プログラム」を動かすためだけに使っている。
    診断アプリ本体は GitHub Pages 側にある。
    ここを直接開いた人が迷わないよう、案内だけ出しておく。
  -->
  <div class="box">
    <h1>投資デビュー診断</h1>
    <p>
      このアドレスは、お支払いを確認するための処理専用です。<br>
      診断はこちらからご利用ください。
    </p>
    <a class="btn" href="https://toshi-debut.github.io/">診断ページへ →</a>
  </div>
</body>
</html>
